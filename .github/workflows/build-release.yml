name: Build Release APK & AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.4.0)，留空則不發布 Release'
        required: false
        default: ''
      build_number:
        description: 'versionCode（留空則自動遞增：1000 + run_number）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Compute build number (versionCode)
        id: version
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            BN="${{ inputs.build_number }}"
            echo "使用手動輸入的 versionCode: $BN"
          else
            BN=$(( 1000 + ${{ github.run_number }} ))
            echo "自動遞增 versionCode: $BN (1000 + run_number ${{ github.run_number }})"
          fi
          echo "build_number=$BN" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../keystore.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release --build-number=${{ steps.version.outputs.build_number }} --obfuscate --split-debug-info=build/app/outputs/symbols
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/vocpass.apk

      - name: Build release AAB
        run: |
          flutter build appbundle --release --build-number=${{ steps.version.outputs.build_number }} --obfuscate --split-debug-info=build/app/outputs/symbols
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/vocpass.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/vocpass.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/vocpass.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/vocpass.apk
            build/app/outputs/bundle/release/vocpass.aab
          generate_release_notes: true
          make_latest: true
